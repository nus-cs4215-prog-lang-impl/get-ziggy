 name: Build and Push Nix Docker Image

 on:
   push:
     branches: [ main ]
     tags: [ 'v*' ]
   pull_request:
     branches: [ main ]

 jobs:
   build:
     runs-on: ubuntu-latest
     permissions:
       contents: read
       packages: write

     steps:
       - name: Checkout repository
         uses: actions/checkout@v3

       - name: Install Nix
         uses: DeterminateSystems/nix-installer-action@main

       - name: Setup Nix Cache
         uses: DeterminateSystems/magic-nix-cache-action@main

       - name: Build Docker image with Nix
         run: |
           nix build .#docker
           # Load the image into Docker
           docker load < result

       - name: Log in to GitHub Container Registry
         if: github.event_name != 'pull_request'
         uses: docker/login-action@v2
         with:
           registry: ghcr.io
           username: ${{ github.actor }}
           password: ${{ secrets.GITHUB_TOKEN }}

       - name: Tag and push Docker image
         if: github.event_name != 'pull_request'
         run: |
           # Get the image ID
           IMAGE_ID=$(docker images --format "{{.ID}}" zig-antlr-shell:latest)

           # Tag with GitHub repository name
           REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
           docker tag $IMAGE_ID ghcr.io/$REPO_NAME:latest

           # If this is a tag, also tag with version
           if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
             VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(v.*\),\1,')
             docker tag $IMAGE_ID ghcr.io/$REPO_NAME:$VERSION
           fi

           # Push all tags
           docker push --all-tags ghcr.io/$REPO_NAME
